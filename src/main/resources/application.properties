spring.application.name=chainledger
server.port=${PORT:8080}

chainledger.node-id=${NODE_ID:node-1}
chainledger.difficulty-bits=${DIFFICULTY_BITS:18}
chainledger.mining-threads=${MINING_THREADS:0}
chainledger.target-block-millis=5000
chainledger.peers=${PEERS:}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/chainledger}
spring.datasource.username=${DATABASE_USER:${USER}}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
